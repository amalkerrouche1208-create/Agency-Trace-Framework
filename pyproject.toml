[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agencytrace"
version = "0.1.1"
description = "Trace reconstruction and behavioral analysis for human-AI co-writing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

ml = [
    "scikit-learn>=1.5",
]

[project.scripts]
agencytrace = "agencytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]