[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agencytrace"
version = "0.1.1"
description = "CoAuthor trace reconstruction for AgencyTrace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agencytrace = "agencytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
